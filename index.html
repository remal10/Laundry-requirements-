<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remal Hotel & Villas - Guest Laundry Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0e0c;
            --bg-card: #181614;
            --bg-card-hover: #211e1a;
            --text-gold: #DCA773;
            --border-gold: #2f2820;
            --text-main: #f3f4f6;
            --text-muted: #a8a29e;
            --header-overlay-gradient: linear-gradient(to top, rgba(24, 22, 20, 0.9) 0%, rgba(24, 22, 20, 0.4) 60%, transparent 100%);
            --header-img-opacity: 0.45;
        }

        .light-mode {
            --bg-dark: #f1f5f9;
            --bg-card: #ffffff;
            --bg-card-hover: #e2e8f0;
            --text-gold: #b47a3e;
            --border-gold: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
            --header-overlay-gradient: linear-gradient(to top, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.3) 60%, transparent 100%);
            --header-img-opacity: 0.75;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .remal-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-gold); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
        }

        .remal-input { 
            background: var(--bg-dark); 
            border: 1px solid var(--border-gold); 
            color: var(--text-main); 
            transition: border-color 0.2s ease;
        }

        .remal-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .remal-input:focus { 
            border-color: var(--text-gold); 
            outline: none; 
        }

        .text-muted-custom {
            color: var(--text-muted);
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center pb-24">

    <div class="w-full max-w-md remal-card p-6 sm:p-8 rounded-3xl space-y-5 relative">
        
        <!-- BARRE SUPÉRIEURE : MODE NUIT/JOUR & SELECTEUR DE LANGUE AVEC DRAPEAUX -->
        <div class="flex justify-between items-center">
            <button onclick="toggleTheme()" class="bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] w-9 h-9 rounded-xl text-xs flex items-center justify-center shadow transition hover:scale-105" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>

            <!-- CUSTOM DRAPEAU / LANGUE DROPDOWN -->
            <div class="relative inline-block text-left">
                <button onclick="toggleLangDropdown()" id="langDropdownBtn" class="bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] text-xs font-bold rounded-xl px-3 py-1.5 flex items-center gap-2 shadow">
                    <span id="currentLangFlag">🇬🇧</span> <span id="currentLangText">English</span> <i class="fas fa-chevron-down text-[10px]"></i>
                </button>
                <div id="langMenu" class="hidden absolute right-0 mt-2 w-36 bg-[var(--bg-card)] border border-[var(--border-gold)] rounded-2xl shadow-2xl z-50 overflow-hidden text-xs font-bold animate-fade-in">
                    <button onclick="changerLangueCustom('en')" class="w-full text-left px-3 py-2.5 hover:bg-[var(--bg-card-hover)] flex items-center gap-2 border-b border-[var(--border-gold)]">
                        <span>🇬🇧</span> English
                    </button>
                    <button onclick="changerLangueCustom('fr')" class="w-full text-left px-3 py-2.5 hover:bg-[var(--bg-card-hover)] flex items-center gap-2 border-b border-[var(--border-gold)]">
                        <span>🇫🇷</span> Français
                    </button>
                    <button onclick="changerLangueCustom('ar')" class="w-full text-left px-3 py-2.5 hover:bg-[var(--bg-card-hover)] flex items-center gap-2 border-b border-[var(--border-gold)]">
                        <span>🇦🇪</span> العربية
                    </button>
                    <button onclick="changerLangueCustom('hi')" class="w-full text-left px-3 py-2.5 hover:bg-[var(--bg-card-hover)] flex items-center gap-2">
                        <span>🇮🇳</span> हिन्दी
                    </button>
                </div>
            </div>
        </div>

        <!-- EN-TÊTE AVEC PHOTO DE L'HÔTEL ORIGINAL EN BACKGROUND -->
        <div class="relative text-center border border-[var(--border-gold)] pb-5 pt-6 rounded-2xl overflow-hidden shadow-md">
            <div class="absolute inset-0 bg-cover bg-center pointer-events-none transition-opacity duration-300" style="background-image: url('remal-hotel.jpg'); opacity: var(--header-img-opacity);"></div>
            <div class="absolute inset-0 pointer-events-none" style="background: var(--header-overlay-gradient);"></div>

            <div class="relative z-10 space-y-1">
                <h1 class="text-xl font-serif font-bold text-[var(--text-gold)] tracking-[0.2em] drop-shadow">REMAL</h1>
                <p class="text-[10px] text-[var(--text-main)] tracking-[0.15em] font-bold uppercase drop-shadow-sm">Hotel & Villas • Al Ruwais City</p>
                <span class="inline-block mt-3 text-[10px] bg-[var(--bg-card)] text-[var(--text-gold)] border border-[var(--border-gold)] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow" data-i18n="badgeTitle">
                    Laundry & Valet Service
                </span>
            </div>
        </div>

        <!-- Indicateur d'étapes visuel -->
        <div class="grid grid-cols-3 gap-1.5 text-center text-[9px] font-bold text-muted-custom uppercase tracking-wider pb-1">
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-1.5 rounded-lg text-[var(--text-gold)]">1. Room</div>
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-1.5 rounded-lg text-[var(--text-gold)]">2. Selection</div>
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-1.5 rounded-lg">3. Send</div>
        </div>

        <!-- Formulaire de requête -->
        <div class="space-y-4 text-xs">
            <div class="flex justify-between items-center">
                <label class="block font-bold text-muted-custom uppercase tracking-wide" data-i18n="roomLabel">Room Number *</label>
                <button onclick="changerDeChambre()" id="btnChangeRoom" class="hidden text-[10px] text-[var(--text-gold)] underline font-bold" data-i18n="changeRoom">Change</button>
            </div>
            
            <input type="number" id="guestRoomInput" oninput="chargerInfosChambre(this.value)" placeholder="e.g., 103" class="w-full remal-input rounded-2xl p-4 font-bold text-base text-[var(--text-gold)]">

            <!-- CASE À COCHER EXTRA CHARGED -->
            <div class="flex items-center gap-3 p-3 bg-[var(--bg-card-hover)] border border-[var(--border-gold)] rounded-2xl cursor-pointer hover:border-[var(--text-gold)] transition">
                <input type="checkbox" id="extraChargedCheck" class="w-4 h-4 accent-[#DCA773] cursor-pointer">
                <label for="extraChargedCheck" class="font-bold text-[var(--text-main)] cursor-pointer select-none text-[11px]" data-i18n="extraChargedLabel">I accept to pay for Extra Charged items</label>
            </div>

            <!-- Fiche Client chargée dynamiquement depuis Supabase -->
            <div id="roomInfoBox" class="hidden p-4 bg-[var(--bg-card-hover)] border border-[var(--border-gold)] rounded-2xl space-y-1.5 transition-all animate-fade-in">
                <div class="flex justify-between font-bold">
                    <span class="text-muted-custom" data-i18n="guestName">Guest Name:</span> 
                    <span id="displayGuestName" class="text-[var(--text-gold)]">---</span>
                </div>
                <div class="flex justify-between font-bold border-t border-[var(--border-gold)] pt-1.5">
                    <span class="text-muted-custom" data-i18n="pmsQuota">PMS Quota:</span> 
                    <span id="displayQuota" class="text-emerald-600 dark:text-emerald-500">---</span>
                </div>
            </div>

            <div>
                <label class="block font-bold text-muted-custom mb-1.5 uppercase tracking-wide" data-i18n="serviceType">Service Type</label>
                <select id="guestServiceSelect" class="w-full remal-input rounded-2xl p-3.5 font-semibold cursor-pointer text-sm">
                    <option value="Laundry Collection" data-i18n="opt1">Laundry Collection</option>
                    <option value="Dry Cleaning" data-i18n="opt2">Dry Cleaning</option>
                    <option value="Pressing Only" data-i18n="opt3">Pressing Only</option>
                    <option value="Extra Hangers" data-i18n="opt4">Extra Hangers</option>
                    <option value="On Hanger" data-i18n="opt5">On Hanger</option>
                    <option value="Remove the Stains" data-i18n="opt6">Remove the Stains</option>
                    <option value="Urgent" data-i18n="opt7">Urgent</option>
                </select>
            </div>

            <!-- BOUTON POUR OUVRIR LA LISTE DE LAUNDRY -->
            <div>
                <button onclick="openLaundryModal()" class="w-full bg-[var(--bg-card-hover)] hover:bg-[var(--border-gold)] text-[var(--text-gold)] border border-[var(--border-gold)] font-bold py-4 px-4 rounded-2xl transition flex items-center justify-between shadow-md hover:scale-[1.01]">
                    <span class="flex items-center gap-2.5"><i class="fas fa-shirt text-sm"></i> <span data-i18n="openCatalogBtn">Select Laundry Items</span></span>
                    <span id="selectedBadgeCount" class="bg-[var(--text-gold)] text-stone-950 px-3 py-1 rounded-full text-[10px] font-extrabold shadow-sm">0 pcs</span>
                </button>
            </div>

            <!-- SECTION NOTES & RECOMMANDATIONS -->
            <div>
                <label class="block font-bold text-muted-custom mb-1.5 uppercase tracking-wide" data-i18n="notesLabel">Special Recommendations / Notes</label>
                <textarea id="guestDetailsArea" data-i18n-placeholder="notesPlaceholder" placeholder="e.g., Stain on collar, handle with care..." class="w-full h-20 remal-input rounded-2xl p-3.5 outline-none resize-none font-medium text-sm"></textarea>
            </div>

            <button onclick="openPolicyConfirmationModal()" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-stone-950 font-bold py-4 rounded-2xl text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2.5 uppercase tracking-wider mt-2 hover:scale-[1.01]">
                <i class="fab fa-whatsapp text-lg"></i> <span data-i18n="whatsappBtn">Send Request on WhatsApp</span>
            </button>
        </div>

        <div class="text-center text-[10px] text-muted-custom pt-2 border-t border-[var(--border-gold)]" data-i18n="footerText">
            Remal Hotel & Villas Digital Systems
        </div>
    </div>

    <!-- BARRE FLOTTANTE DE RÉSUMÉ RAPIDE -->
    <div id="floatingCartBar" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-[var(--bg-card)] border border-[var(--text-gold)] p-3.5 rounded-2xl shadow-2xl z-50 flex justify-between items-center animate-fade-in no-print">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-[var(--text-gold)] text-stone-950 font-black flex items-center justify-center text-xs shadow">
                <i class="fas fa-basket-shopping"></i>
            </div>
            <div>
                <p id="floatingCartPieces" class="text-xs font-bold text-[var(--text-gold)]">0 pieces selected</p>
                <p id="floatingCartPrice" class="text-[10px] text-muted-custom font-semibold">0.00 AED</p>
            </div>
        </div>
        <button onclick="openLaundryModal()" class="bg-[var(--text-gold)] hover:bg-[#c89360] text-stone-950 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider shadow transition" data-i18n="viewCartBtn">
            View / Edit
        </button>
    </div>

    <!-- MODALE CATALOGUE & PRIX DE LAUNDRY -->
    <div id="laundryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[var(--bg-card)] border border-[var(--border-gold)] w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            
            <div class="flex justify-between items-center border-b border-[var(--border-gold)] pb-3">
                <h3 class="text-sm font-serif font-bold text-[var(--text-gold)] uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-list-check"></i> <span data-i18n="catalogTitle">Laundry Price List & Selection</span>
                </h3>
                <button onclick="closeLaundryModal()" class="text-muted-custom hover:text-[var(--text-main)] text-xl font-bold p-1">✕</button>
            </div>

            <!-- CHAMP DE RECHERCHE DANS LE CATALOGUE -->
            <div class="relative">
                <i class="fas fa-magnifying-glass absolute left-3.5 top-3 text-muted-custom text-xs"></i>
                <input type="text" id="catalogSearchInput" oninput="renderCatalogItems()" placeholder="Search item (e.g., Overall, Dress, Shirt)..." class="w-full remal-input rounded-xl pl-9 pr-3 py-2 text-xs font-semibold">
            </div>

            <!-- 3 BOUTONS DE COMPTAGE -->
            <div>
                <label class="block text-[10px] font-bold text-muted-custom mb-1.5 uppercase tracking-wide" data-i18n="accountTypeLabel">Account & Quota Type</label>
                <div class="grid grid-cols-3 gap-1.5 bg-[var(--bg-dark)] p-1.5 rounded-2xl border border-[var(--border-gold)] text-[10px] font-bold text-center">
                    <button onclick="selectCountType('hotel', true)" id="btnCountHotel" class="py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow transition leading-tight">Hotel Count (Free)</button>
                    <button onclick="selectCountType('quota_extra', true)" id="btnCountQuotaExtra" class="py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight">Hotel & Extra</button>
                    <button onclick="selectCountType('guest', true)" id="btnCountGuest" class="py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight">Guest Count (Full)</button>
                </div>
            </div>

            <!-- Onglets de service -->
            <div class="flex gap-2 text-xs font-bold">
                <button onclick="switchCatalogService('laundry')" id="catTabLaundry" class="flex-1 py-2.5 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow transition">Laundry</button>
                <button onclick="switchCatalogService('dry')" id="catTabDry" class="flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-muted-custom border border-[var(--border-gold)] transition">Dry Cleaning</button>
                <button onclick="switchCatalogService('pressing')" id="catTabPressing" class="flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-muted-custom border border-[var(--border-gold)] transition">Pressing</button>
            </div>

            <!-- Liste des articles -->
            <div id="catalogItemsContainer" class="flex-1 overflow-y-auto pr-1 space-y-3 scrollbar-none"></div>

            <!-- Résumé et validation -->
            <div class="border-t border-[var(--border-gold)] pt-3 space-y-3">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-muted-custom" data-i18n="modalSelectedTotal">Selected Items & Subtotal:</span>
                    <span id="modalCatalogTotalSummary" class="text-[var(--text-gold)] font-serif text-sm">0 pcs · 0.00 AED</span>
                </div>
                <button onclick="confirmLaundrySelection()" class="w-full bg-[var(--text-gold)] hover:bg-[#c89360] text-stone-950 font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider shadow-lg transition hover:scale-[1.01]" data-i18n="confirmSelectionBtn">
                    Confirm Selection
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMATION AVEC MENTIONS ET CONDITIONS -->
    <div id="policyModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-[120] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[var(--bg-card)] border border-[var(--border-gold)] w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col text-xs" id="policyModalContent">
            
            <div class="flex justify-between items-center border-b border-[var(--border-gold)] pb-3">
                <h3 class="text-sm font-serif font-bold text-[var(--text-gold)] uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-file-contract"></i> <span id="policyModalHeader">Order Confirmation & Policy</span>
                </h3>
                <button onclick="closePolicyConfirmationModal()" class="text-muted-custom hover:text-[var(--text-main)] text-xl font-bold p-1">✕</button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-4 pr-1 scrollbar-none">
                <!-- TAX & VAT BANNER -->
                <div id="modalVatNotice" class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] p-3 rounded-2xl text-center font-bold text-[var(--text-gold)] text-[11px]">
                </div>

                <!-- DELIVERY TIMINGS & EXPRESS SERVICE -->
                <div class="space-y-2 bg-[var(--bg-dark)] p-3.5 rounded-2xl border border-[var(--border-gold)]">
                    <h4 id="modalDeliveryTitle" class="font-bold uppercase text-[var(--text-gold)] text-[11px] border-b border-[var(--border-gold)] pb-1.5 flex items-center gap-2">
                        <i class="fas fa-clock"></i> <span></span>
                    </h4>
                    <ul class="space-y-1.5 text-[var(--text-main)] text-[11px] leading-relaxed">
                        <li id="modalBefore9"></li>
                        <li id="modalAfter9"></li>
                        <li id="modalExpress" class="font-bold text-amber-500 dark:text-amber-400 pt-1"></li>
                    </ul>
                </div>

                <!-- PLEASE NOTE & LIMITATION OF LIABILITY -->
                <div class="space-y-2 bg-[var(--bg-dark)] p-3.5 rounded-2xl border border-[var(--border-gold)]">
                    <h4 id="modalTermsTitle" class="font-bold uppercase text-[var(--text-gold)] text-[11px] border-b border-[var(--border-gold)] pb-1.5 flex items-center gap-2">
                        <i class="fas fa-circle-exclamation"></i> <span></span>
                    </h4>
                    <p id="modalTermsBody" class="text-[11px] text-muted-custom leading-relaxed"></p>
                    
                    <div id="modalLiability" class="bg-red-500/10 dark:bg-red-950/30 border-l-2 border-red-600 dark:border-red-800 p-2.5 rounded-r-xl text-red-600 dark:text-red-300 font-semibold text-[11px] mt-2 leading-relaxed">
                    </div>
                </div>
            </div>

            <!-- ACCEPTATION ET VALIDATION FINAL WHATSAPP -->
            <div class="border-t border-[var(--border-gold)] pt-3 space-y-3">
                <div class="flex items-start gap-2.5 bg-[var(--bg-dark)] p-3 rounded-2xl border border-[var(--border-gold)]">
                    <input type="checkbox" id="acceptPolicyCheck" class="w-4 h-4 mt-0.5 accent-[#DCA773] cursor-pointer">
                    <label for="acceptPolicyCheck" class="text-[11px] font-bold text-[var(--text-main)] cursor-pointer select-none" id="modalAcceptCheckText">
                        I have read and agree to the hotel laundry policies and delivery terms.
                    </label>
                </div>

                <button id="finalSendBtnContainer" onclick="confirmAndSendWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-stone-950 font-bold py-3.5 rounded-2xl text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2.5 uppercase tracking-wider hover:scale-[1.01]">
                    <i id="btnSendIcon" class="fab fa-whatsapp text-lg"></i> 
                    <span id="modalFinalSendBtn">Confirm & Send on WhatsApp</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        const flags = { en: "🇬🇧", fr: "🇫🇷", ar: "🇦🇪", hi: "🇮🇳" };
        const langNames = { en: "English", fr: "Français", ar: "العربية", hi: "हिन्दी" };

        function toggleLangDropdown() {
            document.getElementById('langMenu').classList.toggle('hidden');
        }

        function changerLangueCustom(lang) {
            document.getElementById('langMenu').classList.add('hidden');
            document.getElementById('currentLangFlag').innerText = flags[lang];
            document.getElementById('currentLangText').innerText = langNames[lang];
            changerLangue(lang);
        }

        function triggerErrorNotification() {
            if ("vibrate" in navigator) {
                navigator.vibrate(100);
            }
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("AudioContext unsupported or blocked");
            }
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            if (isLight) {
                icon.className = 'fas fa-sun';
                localStorage.setItem('remal_theme', 'light');
            } else {
                icon.className = 'fas fa-moon';
                localStorage.setItem('remal_theme', 'dark');
            }
            if (typeof renderCatalogItems === 'function') {
                renderCatalogItems();
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('remal_theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                if (icon) icon.className = 'fas fa-sun';
            } else {
                document.body.classList.remove('light-mode');
                if (icon) icon.className = 'fas fa-moon';
            }
        }

        /* BASE DE DONNÉES COMPLÈTE ISSUE DE L'APPLICATION PRINCIPALE */
        const database = {
            laundry: {
                "GENTLEMEN": [
                    { name: "Shirt", ar: "قميص", price: 22, icon: "fa-shirt" },
                    { name: "T-Shirt", ar: "فانيلة", price: 15, icon: "fa-shirt" },
                    { name: "Trousers", ar: "بنطلون", price: 24, icon: "fa-vest" },
                    { name: "Under Shirt", ar: "قميص داخلي", price: 10, icon: "fa-shirt" },
                    { name: "Under Pants", ar: "سروال داخلي", price: 12, icon: "fa-vest" },
                    { name: "Pajama Slack", ar: "بيجامة سلاك", price: 11, icon: "fa-bed" },
                    { name: "Pajamas (2 Pcs)", ar: "بيجامة قطعتين", price: 22, icon: "fa-bed" },
                    { name: "Socks", ar: "جوارب", price: 6, icon: "fa-socks" },
                    { name: "Jacket", ar: "جاكيت", price: 34, icon: "fa-vest" },

        function parsePMSQuotaNumber(quotaStr) {
            if (!quotaStr) return 0;
            let cleaned = quotaStr.toLowerCase();
            if (cleaned.includes('chargeable') || cleaned.includes('no free') || cleaned.includes('standard')) return 0;
            
            const match = cleaned.match(/\d+/);
            if (match) {
                return parseInt(match[0], 10);
            }
            return 0;
        }

        function selectCountType(type, isManualClick = false) {
            const quotaText = cachedGuestData ? cachedGuestData.quota_text : 'Standard';
            const allowedFreePcs = parsePMSQuotaNumber(quotaText);
            const isChargeable = quotaText.toLowerCase().includes('chargeable') || allowedFreePcs === 0;

            let currentTotalPcs = 0;
            Object.values(catalogCart).forEach(i => currentTotalPcs += i.qty);

            let enforcedType = type;

            if (isChargeable) {
                enforcedType = 'guest';
                if (isManualClick && type !== 'guest') {
                    triggerErrorNotification();
                    alert(currentLang === 'ar' 
                        ? '⚠️ هذه الغرفة غير مشمولة بالحصة المجانية. يتم تطبيق رسوم الكاملة تلقائياً.' 
                        : '⚠️ This room has no free quota package. Full Guest Count applies.');
                }
            } else {
                if (currentTotalPcs > allowedFreePcs) {
                    enforcedType = 'quota_extra';
                    if (isManualClick && type !== 'quota_extra') {
                        triggerErrorNotification();
                        alert(currentLang === 'ar' 
                            ? `⚠️ لقد تجاوزت الحصة المجانية (${allowedFreePcs} قطع). تم اختيار حساب القطع الإضافية تلقائياً.` 
                            : `⚠️ You have exceeded your free quota of ${allowedFreePcs} pcs. Hotel & Extra is enforced.`);
                    }
                } else {
                    enforcedType = 'hotel';
                    if (isManualClick && type !== 'hotel') {
                        triggerErrorNotification();
                        alert(currentLang === 'ar' 
                            ? `⚠️ عدد القطع ضمن الحصة المجانية (${allowedFreePcs} قطع). تم الحفاظ على الحساب المجاني.` 
                            : `⚠️ Total items are within your free quota (${allowedFreePcs} pcs). Free Hotel Count applies.`);
                    }
                }
            }

            currentCountType = enforcedType;

            document.getElementById('btnCountHotel').className = currentCountType === 'hotel' 
                ? 'py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold leading-tight' 
                : 'py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight opacity-50 cursor-not-allowed';

            document.getElementById('btnCountQuotaExtra').className = currentCountType === 'quota_extra' 
                ? 'py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold leading-tight' 
                : 'py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight opacity-50 cursor-not-allowed';

            document.getElementById('btnCountGuest').className = currentCountType === 'guest' 
                ? 'py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold leading-tight' 
                : 'py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight opacity-50 cursor-not-allowed';

            renderCatalogItems();
        }

        function switchCatalogService(service) {
            catalogService = service;
            ['laundry', 'dry', 'pressing'].forEach(s => {
                const btn = document.getElementById(`catTab${s.charAt(0).toUpperCase() + s.slice(1)}`);
                if (s === service) {
                    btn.className = "flex-1 py-2.5 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold transition";
                } else {
                    btn.className = "flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-muted-custom border border-[var(--border-gold)] transition";
                }
            });
            renderCatalogItems();
        }

        function renderCatalogItems() {
            const container = document.getElementById('catalogItemsContainer');
            const searchFilter = (document.getElementById('catalogSearchInput')?.value || '').toLowerCase().trim();
            container.innerHTML = '';
            const serviceData = database[catalogService];
            let totalPieces = 0;
            let subtotal = 0;

            for (const [catName, items] of Object.entries(serviceData)) {
                const filteredItems = items.filter(item => 
                    item.name.toLowerCase().includes(searchFilter) || 
                    (item.ar && item.ar.includes(searchFilter))
                );

                if (filteredItems.length === 0) continue;

                const catHeader = document.createElement('div');
                catHeader.className = 'bg-[var(--bg-dark)] text-[var(--text-gold)] px-3 py-1.5 rounded-xl font-bold text-[11px] uppercase tracking-wider mb-2 mt-2 border border-[var(--border-gold)]';
                catHeader.innerText = catName;
                container.appendChild(catHeader);

                filteredItems.forEach(item => {
                    const key = `${catalogService}_${item.name}`;
                    const entry = catalogCart[key] || { qty: 0, freeQty: 0, name: item.name, price: item.price };
                    const qty = entry.qty;
                    const freeQty = entry.freeQty || 0;
                    totalPieces += qty;

                    if (currentCountType === 'guest') {
                        subtotal += item.price * qty;
                    } else if (currentCountType === 'quota_extra') {
                        let chargeable = qty - freeQty;
                        if (chargeable < 0) chargeable = 0;
                        subtotal += item.price * chargeable;
                    }

                    const priceDisplay = currentCountType === 'hotel' ? '0.00 AED' : `${item.price.toFixed(2)} AED`;

                    let freeControlsHtml = '';
                    if (currentCountType === 'quota_extra' && qty > 0) {
                        freeControlsHtml = `
                            <div class="flex items-center gap-1 mt-1 bg-[var(--bg-dark)] px-2 py-0.5 rounded-lg border border-[var(--border-gold)] text-[9px]">
                                <span class="text-muted-custom font-semibold">Free:</span>
                                <button onclick="updateCatalogFreeQty('${key}', -1)" class="w-5 h-5 bg-[var(--bg-card-hover)] text-[var(--text-main)] rounded font-bold">-</button>
                                <span class="text-emerald-600 dark:text-emerald-400 font-bold px-1">${freeQty}</span>
                                <button onclick="updateCatalogFreeQty('${key}', 1)" class="w-5 h-5 bg-[var(--text-gold)] text-stone-950 rounded font-bold">+</button>
                            </div>
                        `;
                    }

                    const row = document.createElement('div');
                    row.className = 'flex justify-between items-center py-2.5 border-b border-[var(--border-gold)] text-xs';
                    row.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <div class="w-7 h-7 rounded-lg bg-[var(--bg-dark)] border border-[var(--border-gold)] text-[var(--text-gold)] flex items-center justify-center text-xs">
                                <i class="fas ${item.icon || 'fa-shirt'}"></i>
                            </div>
                            <div>
                                <p class="font-bold text-[var(--text-main)]">${currentLang === 'ar' ? item.ar : item.name}</p>
                                <p class="text-[10px] ${currentCountType === 'hotel' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-[var(--text-gold)] font-semibold'}">${priceDisplay}</p>
                                ${freeControlsHtml}
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-[var(--bg-dark)] p-1 rounded-xl border border-[var(--border-gold)]">
                            <button onclick="updateCatalogQty('${key}', '${item.name}', ${item.price}, -1)" class="w-6 h-6 bg-[var(--bg-card-hover)] text-[var(--text-main)] rounded-lg font-bold transition active:scale-90">-</button>
                            <span class="font-bold px-2 text-xs text-[var(--text-main)]">${qty}</span>
                            <button onclick="updateCatalogQty('${key}', '${item.name}', ${item.price}, 1)" class="w-6 h-6 bg-[var(--text-gold)] text-stone-950 rounded-lg font-bold transition active:scale-90">+</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            }

            document.getElementById('modalCatalogTotalSummary').innerText = `${totalPieces} pcs · ${subtotal.toFixed(2)} AED`;
        }

        function updateCatalogQty(key, name, price, delta) {
            if (!catalogCart[key]) catalogCart[key] = { name: name, price: price, qty: 0, freeQty: 0 };
            catalogCart[key].qty += delta;

            if (catalogCart[key].qty <= 0) {
                delete catalogCart[key];
            }

            let currentTotalPcs = 0;
            Object.values(catalogCart).forEach(i => currentTotalPcs += i.qty);

            const quotaText = cachedGuestData ? cachedGuestData.quota_text : 'Standard';
            const allowedFreePcs = parsePMSQuotaNumber(quotaText);

            selectCountType(currentCountType, false);

            if (currentCountType === 'quota_extra') {
                document.getElementById('extraChargedCheck').checked = true;
                let remainingFree = allowedFreePcs;
                Object.keys(catalogCart).forEach(itemKey => {
                    let item = catalogCart[itemKey];
                    if (item.qty <= remainingFree) {
                        item.freeQty = item.qty;
                        remainingFree -= item.qty;
                    } else {
                        item.freeQty = remainingFree;
                        remainingFree = 0;
                    }
                });
            } else if (currentCountType === 'hotel') {
                Object.values(catalogCart).forEach(i => i.freeQty = i.qty);
            }

            renderCatalogItems();
        }

        function updateCatalogFreeQty(key, delta) {
            if (!catalogCart[key]) return;
            catalogCart[key].freeQty += delta;
            if (catalogCart[key].freeQty < 0) catalogCart[key].freeQty = 0;
            if (catalogCart[key].freeQty > catalogCart[key].qty) catalogCart[key].freeQty = catalogCart[key].qty;
            renderCatalogItems();
        }

        function confirmLaundrySelection() {
            let totalPcs = 0;
            let subtotalCalc = 0;

            Object.values(catalogCart).forEach(item => {
                if (item.qty > 0) {
                    totalPcs += item.qty;
                    let countMode = currentCountType || 'hotel';
                    if (countMode === 'guest') {
                        subtotalCalc += item.price * item.qty;
                    } else if (countMode === 'quota_extra') {
                        let free = item.freeQty || 0;
                        let extra = item.qty - free;
                        if (extra < 0) extra = 0;
                        subtotalCalc += item.price * extra;
                    }
                }
            });

            document.getElementById('selectedBadgeCount').innerText = `${totalPcs} pcs`;
            
            const floatingBar = document.getElementById('floatingCartBar');
            if (totalPcs > 0) {
                document.getElementById('floatingCartPieces').innerText = `${totalPcs} pieces selected`;
                document.getElementById('floatingCartPrice').innerText = `${subtotalCalc.toFixed(2)} AED`;
                floatingBar.classList.remove('hidden');
            } else {
                floatingBar.classList.add('hidden');
            }

            window.finalLaundryCart = catalogCart;
            window.finalLaundryCountType = currentCountType;

            closeLaundryModal();
        }

        let currentLang = 'en';

        function changerLangue(lang) {
            currentLang = lang;
            localStorage.setItem('remal_lang', lang);
            const t = traductions[lang];
            const htmlRoot = document.getElementById('htmlRoot');
            if (lang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

            if (savedRoom) {
                const roomField = document.getElementById('guestRoomInput');
                roomField.value = savedRoom;
                roomField.setAttribute('readonly', true);
                document.getElementById('btnChangeRoom').classList.remove('hidden');

        async function chargerInfosChambre(roomNum) {
            const box = document.getElementById('roomInfoBox');
            if (!roomNum || roomNum.length < 3) {
                box.classList.add('hidden');
                return;
            }

            localStorage.setItem('remal_guest_room', roomNum);

            const { data, error } = await supabaseClient
                .from('pms_guests')
                .select('*')
                .eq('room', roomNum)
                .single();

            if (error || !data) {
                document.getElementById('displayGuestName').innerText = "Guest (" + roomNum + ")";
                document.getElementById('displayQuota').innerText = "Standard";
                cachedGuestData = { guest_name: "Guest", quota_text: "Standard" };
                box.classList.remove('hidden');
                return;
            }

            cachedGuestData = data;
            document.getElementById('displayGuestName').innerText = data.guest_name;
            document.getElementById('displayQuota').innerText = data.quota_text;
            box.classList.remove('hidden');

            const isChargeable = data.quota_text.toLowerCase().includes('chargeable');
            if (isChargeable) {
                selectCountType('guest', false);
                document.getElementById('extraChargedCheck').checked = true;
            } else {
                selectCountType('hotel', false);
            }
        }

        function confirmAndSendWhatsApp() {
            const isAccepted = document.getElementById('acceptPolicyCheck').checked;
            if (!isAccepted) {
                triggerErrorNotification();
                alert(currentLang === 'ar' ? '⚠️ يرجى الموافقة على الشروط والأحكام للمتابعة.' : '⚠️ Please accept the terms and policies to proceed.');
                return;
            }

            const sendBtnContainer = document.getElementById('finalSendBtnContainer');
            const icon = document.getElementById('btnSendIcon');
            const btnText = document.getElementById('modalFinalSendBtn');

            sendBtnContainer.disabled = true;
            sendBtnContainer.classList.add('opacity-80', 'cursor-not-allowed');
            icon.className = "fas fa-spinner fa-spin text-lg";
            btnText.innerText = currentLang === 'ar' ? 'جاري التحويل...' : 'Connecting WhatsApp...';

            setTimeout(() => {
                envoyerRequeteWhatsApp();
                
                setTimeout(() => {
                    closePolicyConfirmationModal();
                    sendBtnContainer.disabled = false;
                    sendBtnContainer.classList.remove('opacity-80', 'cursor-not-allowed');
                    icon.className = "fab fa-whatsapp text-lg";
                    btnText.innerText = GUEST_POLICIES_DATA[currentLang]?.finalSendBtn || "Confirm & Send on WhatsApp";
                }, 1000);
            }, 600);
        }

        function envoyerRequeteWhatsApp() {
            const room = document.getElementById('guestRoomInput').value.trim();
            const service = document.getElementById('guestServiceSelect').value;
            const specialNotes = document.getElementById('guestDetailsArea').value.trim();
            const isExtraCharged = document.getElementById('extraChargedCheck').checked;

            let itemsListText = "Aucun article sélectionné via le catalogue";
            let totalPiecesCalc = 0;
            let subtotalCalc = 0;

            if (window.finalLaundryCart && Object.keys(window.finalLaundryCart).length > 0) {
                let formattedItems = [];
                Object.values(window.finalLaundryCart).forEach(item => {
                    if (item.qty > 0) {
                        totalPiecesCalc += item.qty;
                        let line = `• ${item.qty}x ${item.name}`;
                        let countMode = window.finalLaundryCountType || 'hotel';
                        
                        if (countMode === 'guest') {
                            let linePrice = item.price * item.qty;
                            subtotalCalc += linePrice;
                            line += ` (${linePrice.toFixed(2)} AED)`;
                        } else if (countMode === 'quota_extra') {
                            let free = item.freeQty || 0;
                            let extra = item.qty - free;
                            if (extra < 0) extra = 0;
                            let linePrice = item.price * extra;
                            subtotalCalc += linePrice;
                            line += ` [${free} Free, ${extra} Extra - ${linePrice.toFixed(2)} AED]`;
                        } else {
                            line += ` (Hotel Free Count)`;
                        }
                        formattedItems.push(line);
                    }
                });
                if (formattedItems.length > 0) {
                    itemsListText = formattedItems.join('\n');
                }
            }

            const guestName = cachedGuestData ? cachedGuestData.guest_name : 'Guest';
            const quotaText = cachedGuestData ? cachedGuestData.quota_text : 'Standard';
            const numeroWhatsAppLaundry = "971561314938";

            const extraChargedText = isExtraCharged ? "✅ YES (Accepts Extra Charges)" : "❌ NO";
            const vatCalc = subtotalCalc * 0.05;
            const grandTotalCalc = subtotalCalc + vatCalc;

            const message = `*🛎️ NOUVELLE REQUÊTE BUANDERIE - GUEST*\n\n` +
                            `🏨 *Chambre / Room:* ${room}\n` +
                            `👤 *Nom / Guest:* ${guestName}\n` +
                            `📋 *Quota PMS:* ${quotaText}\n` +
                            `💳 *Extra Charged:* ${extraChargedText}\n` +
                            `🛠️ *Service:* ${service}\n\n` +
                            `🧺 *Articles sélectionnés (${totalPiecesCalc} pcs):*\n${itemsListText}\n\n` +
                            `💰 *Sous-total:* ${subtotalCalc.toFixed(2)} AED\n` +
                            `🧾 *TVA (5%):* ${vatCalc.toFixed(2)} AED\n` +
                            `💎 *Grand Total:* ${grandTotalCalc.toFixed(2)} AED\n\n` +
                            `📝 *Recommandations / Notes:* \n${specialNotes || 'Aucune note particulière'}\n\n` +
                            `_Envoyé depuis le portail client (Conditions acceptées)._`;

            const urlWhatsApp = `https://wa.me/${numeroWhatsAppLaundry}?text=${encodeURIComponent(message)}`;
            window.open(urlWhatsApp, '_blank');
        }
