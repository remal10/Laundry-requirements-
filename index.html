<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remal Hotel & Villas - Guest Laundry Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0e0c;
            --bg-card: #181614;
            --bg-card-hover: #211e1a;
            --text-gold: #DCA773;
            --border-gold: #2f2820;
            --text-main: #f3f4f6;
        }

        .light-mode {
            --bg-dark: #f4f5f7;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --text-gold: #b47a3e;
            --border-gold: #cbd5e1;
            --text-main: #0f172a;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .remal-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-gold); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
        }

        .remal-input { 
            background: var(--bg-dark); 
            border: 1px solid var(--border-gold); 
            color: var(--text-main); 
            transition: border-color 0.2s ease;
        }

        .remal-input:focus { 
            border-color: var(--text-gold); 
            outline: none; 
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center pb-24">

    <div class="w-full max-w-md remal-card p-6 sm:p-8 rounded-3xl space-y-5 relative">
        
        <!-- BARRE SUPÉRIEURE : MODE NUIT/JOUR & LANGUE -->
        <div class="flex justify-between items-center">
            <button onclick="toggleTheme()" class="bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] w-9 h-9 rounded-xl text-xs flex items-center justify-center shadow transition hover:scale-105" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>

            <select id="langSelect" onchange="changerLangue(this.value)" class="bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] text-xs font-bold rounded-xl px-3 py-1.5 outline-none cursor-pointer">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <!-- EN-TÊTE AVEC PHOTO DE L'HÔTEL EN BACKGROUND -->
        <div class="relative text-center border-b border-[var(--border-gold)] pb-5 pt-6 rounded-2xl overflow-hidden shadow-inner">
            <div class="absolute inset-0 bg-cover bg-center opacity-25 pointer-events-none" style="background-image: url('remal-hotel.jpg');"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[var(--bg-card)] via-[var(--bg-card)]/70 to-transparent pointer-events-none"></div>

            <div class="relative z-10 space-y-1">
                <h1 class="text-xl font-serif font-bold text-[var(--text-gold)] tracking-[0.2em]">REMAL</h1>
                <p class="text-[10px] text-stone-300 tracking-[0.15em] font-medium uppercase">Hotel & Villas • Al Ruwais City</p>
                <span class="inline-block mt-3 text-[10px] bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow" data-i18n="badgeTitle">
                    Laundry & Valet Service
                </span>
            </div>
        </div>

        <!-- Indicateur d'étapes visuel -->
        <div class="grid grid-cols-3 gap-1.5 text-center text-[9px] font-bold text-stone-400 uppercase tracking-wider pb-1">
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-1.5 rounded-lg text-[var(--text-gold)]">1. Room</div>
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-1.5 rounded-lg text-[var(--text-gold)]">2. Selection</div>
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-1.5 rounded-lg">3. Send</div>
        </div>

        <!-- Formulaire de requête -->
        <div class="space-y-4 text-xs">
            <div class="flex justify-between items-center">
                <label class="block font-bold text-stone-400 uppercase tracking-wide" data-i18n="roomLabel">Room Number *</label>
                <button onclick="changerDeChambre()" id="btnChangeRoom" class="hidden text-[10px] text-[var(--text-gold)] underline font-bold" data-i18n="changeRoom">Change</button>
            </div>
            
            <input type="number" id="guestRoomInput" oninput="chargerInfosChambre(this.value)" placeholder="e.g., 103" class="w-full remal-input rounded-2xl p-4 font-bold text-base text-[var(--text-gold)]">

            <!-- CASE À COCHER EXTRA CHARGED -->
            <div class="flex items-center gap-3 p-3 bg-[var(--bg-card-hover)] border border-[var(--border-gold)] rounded-2xl cursor-pointer hover:border-[var(--text-gold)] transition">
                <input type="checkbox" id="extraChargedCheck" class="w-4 h-4 accent-[#DCA773] cursor-pointer">
                <label for="extraChargedCheck" class="font-bold text-stone-300 cursor-pointer select-none text-[11px]" data-i18n="extraChargedLabel">I accept to pay for Extra Charged items</label>
            </div>

            <!-- Fiche Client chargée dynamiquement depuis Supabase -->
            <div id="roomInfoBox" class="hidden p-4 bg-[var(--bg-card-hover)] border border-[var(--border-gold)] rounded-2xl space-y-1.5 transition-all animate-fade-in">
                <div class="flex justify-between font-bold">
                    <span class="text-stone-400" data-i18n="guestName">Guest Name:</span> 
                    <span id="displayGuestName" class="text-[var(--text-gold)]">---</span>
                </div>
                <div class="flex justify-between font-bold border-t border-[var(--border-gold)] pt-1.5">
                    <span class="text-stone-400" data-i18n="pmsQuota">PMS Quota:</span> 
                    <span id="displayQuota" class="text-emerald-500">---</span>
                </div>
            </div>

            <div>
                <label class="block font-bold text-stone-400 mb-1.5 uppercase tracking-wide" data-i18n="serviceType">Service Type</label>
                <select id="guestServiceSelect" class="w-full remal-input rounded-2xl p-3.5 font-semibold cursor-pointer text-sm">
                    <option value="Laundry Collection" data-i18n="opt1">Laundry Collection</option>
                    <option value="Dry Cleaning" data-i18n="opt2">Dry Cleaning</option>
                    <option value="Pressing Only" data-i18n="opt3">Pressing Only</option>
                    <option value="Extra Hangers" data-i18n="opt4">Extra Hangers</option>
                    <option value="On Hanger" data-i18n="opt5">On Hanger</option>
                    <option value="Remove the Stains" data-i18n="opt6">Remove the Stains</option>
                    <option value="Urgent" data-i18n="opt7">Urgent</option>
                </select>
            </div>

            <!-- BOUTON POUR OUVRIR LA LISTE DE LAUNDRY -->
            <div>
                <button onclick="openLaundryModal()" class="w-full bg-[var(--bg-card-hover)] hover:bg-[var(--border-gold)] text-[var(--text-gold)] border border-[var(--border-gold)] font-bold py-4 px-4 rounded-2xl transition flex items-center justify-between shadow-md hover:scale-[1.01]">
                    <span class="flex items-center gap-2.5"><i class="fas fa-shirt text-sm"></i> <span data-i18n="openCatalogBtn">Select Laundry Items</span></span>
                    <span id="selectedBadgeCount" class="bg-[var(--text-gold)] text-stone-950 px-3 py-1 rounded-full text-[10px] font-extrabold shadow-sm">0 pcs</span>
                </button>
            </div>

            <!-- SECTION NOTES & RECOMMANDATIONS -->
            <div>
                <label class="block font-bold text-stone-400 mb-1.5 uppercase tracking-wide" data-i18n="notesLabel">Special Recommendations / Notes</label>
                <textarea id="guestDetailsArea" data-i18n-placeholder="notesPlaceholder" placeholder="e.g., Stain on collar, handle with care..." class="w-full h-20 remal-input rounded-2xl p-3.5 outline-none resize-none font-medium text-sm"></textarea>
            </div>

            <button onclick="envoyerRequeteWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-stone-950 font-bold py-4 rounded-2xl text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2.5 uppercase tracking-wider mt-2 hover:scale-[1.01]">
                <i class="fab fa-whatsapp text-lg"></i> <span data-i18n="whatsappBtn">Send Request on WhatsApp</span>
            </button>
        </div>

        <div class="text-center text-[10px] text-stone-500 pt-2 border-t border-[var(--border-gold)]" data-i18n="footerText">
            Remal Hotel & Villas Digital Systems
        </div>
    </div>

    <!-- BARRE FLOTTANTE DE RÉSUMÉ RAPIDE -->
    <div id="floatingCartBar" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-[var(--bg-card)] border border-[var(--text-gold)] p-3.5 rounded-2xl shadow-2xl z-50 flex justify-between items-center animate-fade-in no-print">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-[var(--text-gold)] text-stone-950 font-black flex items-center justify-center text-xs shadow">
                <i class="fas fa-basket-shopping"></i>
            </div>
            <div>
                <p id="floatingCartPieces" class="text-xs font-bold text-[var(--text-gold)]">0 pieces selected</p>
                <p id="floatingCartPrice" class="text-[10px] text-stone-400 font-semibold">0.00 AED</p>
            </div>
        </div>
        <button onclick="openLaundryModal()" class="bg-[var(--text-gold)] hover:bg-[#c89360] text-stone-950 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider shadow transition" data-i18n="viewCartBtn">
            View / Edit
        </button>
    </div>

    <!-- MODALE CATALOGUE & PRIX DE LAUNDRY -->
    <div id="laundryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[var(--bg-card)] border border-[var(--border-gold)] w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            
            <div class="flex justify-between items-center border-b border-[var(--border-gold)] pb-3">
                <h3 class="text-sm font-serif font-bold text-[var(--text-gold)] uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-list-check"></i> <span data-i18n="catalogTitle">Laundry Price List & Selection</span>
                </h3>
                <button onclick="closeLaundryModal()" class="text-stone-400 hover:text-[var(--text-main)] text-xl font-bold p-1">✕</button>
            </div>

            <!-- 3 BOUTONS DE COMPTAGE -->
            <div>
                <label class="block text-[10px] font-bold text-stone-400 mb-1.5 uppercase tracking-wide" data-i18n="accountTypeLabel">Account & Quota Type</label>
                <div class="grid grid-cols-3 gap-1.5 bg-[var(--bg-dark)] p-1.5 rounded-2xl border border-[var(--border-gold)] text-[10px] font-bold text-center">
                    <button onclick="selectCountType('hotel')" id="btnCountHotel" class="py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow transition leading-tight">Hotel Count (Free)</button>
                    <button onclick="selectCountType('quota_extra')" id="btnCountQuotaExtra" class="py-2.5 px-1 rounded-xl text-stone-400 transition leading-tight">Hotel & Extra</button>
                    <button onclick="selectCountType('guest')" id="btnCountGuest" class="py-2.5 px-1 rounded-xl text-stone-400 transition leading-tight">Guest Count (Full)</button>
                </div>
            </div>

            <!-- Onglets de service -->
            <div class="flex gap-2 text-xs font-bold">
                <button onclick="switchCatalogService('laundry')" id="catTabLaundry" class="flex-1 py-2.5 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow transition">Laundry</button>
                <button onclick="switchCatalogService('dry')" id="catTabDry" class="flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-stone-400 border border-[var(--border-gold)] transition">Dry Cleaning</button>
                <button onclick="switchCatalogService('pressing')" id="catTabPressing" class="flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-stone-400 border border-[var(--border-gold)] transition">Pressing</button>
            </div>

            <!-- Liste des articles -->
            <div id="catalogItemsContainer" class="flex-1 overflow-y-auto pr-1 space-y-3 scrollbar-none"></div>

            <!-- Résumé et validation -->
            <div class="border-t border-[var(--border-gold)] pt-3 space-y-3">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-stone-400" data-i18n="modalSelectedTotal">Selected Items & Subtotal:</span>
                    <span id="modalCatalogTotalSummary" class="text-[var(--text-gold)] font-serif text-sm">0 pcs · 0.00 AED</span>
                </div>
                <button onclick="confirmLaundrySelection()" class="w-full bg-[var(--text-gold)] hover:bg-[#c89360] text-stone-950 font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider shadow-lg transition hover:scale-[1.01]" data-i18n="confirmSelectionBtn">
                    Confirm Selection
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            if (isLight) {
                icon.className = 'fas fa-sun';
                localStorage.setItem('remal_theme', 'light');
            } else {
                icon.className = 'fas fa-moon';
                localStorage.setItem('remal_theme', 'dark');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('remal_theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                if (icon) icon.className = 'fas fa-sun';
            } else {
                document.body.classList.remove('light-mode');
                if (icon) icon.className = 'fas fa-moon';
            }
        }

        const database = {
            laundry: {
                "GENTLEMEN": [
                    { name: "Shirt", ar: "قميص", price: 22, icon: "fa-shirt" }, { name: "T-Shirt", ar: "فانيلة", price: 15, icon: "fa-shirt" }, { name: "Trousers", ar: "بنطلون", price: 24, icon: "fa-vest" },
                    { name: "Under Shirt", ar: "قميص داخلي", price: 10, icon: "fa-shirt" }, { name: "Under Pants", ar: "سروال داخلي", price: 12, icon: "fa-vest" }, { name: "Pajama Slack", ar: "بيجامة سلاك", price: 11, icon: "fa-bed" },
                    { name: "Pajamas (2 Pcs)", ar: "بيجامة قطعتين", price: 22, icon: "fa-bed" }, { name: "Socks", ar: "جوارب", price: 6, icon: "fa-socks" }, { name: "Jacket", ar: "جاكيت", price: 34, icon: "fa-vest" },
                    { name: "Dishdash", ar: "دشداشة", price: 30, icon: "fa-user-tie" }, { name: "Gutra", ar: "غترة", price: 10, icon: "fa-head-side-mask" }, { name: "Khafia", ar: "كوفية", price: 10, icon: "fa-hat-cowboy" },
                    { name: "Lungi", ar: "وزار", price: 15, icon: "fa-vest" }, { name: "Shorts", ar: "سروال قصير", price: 18, icon: "fa-vest" }, { name: "Track Suit", ar: "بدلة رياضة", price: 30, icon: "fa-person-running" }
                ],
                "LADIES": [
                    { name: "Dress", ar: "فستان", price: 42, icon: "fa-person-dress" }, { name: "Blouse", ar: "بلوزة", price: 24, icon: "fa-shirt" }, { name: "Skirt", ar: "تنورة", price: 24, icon: "fa-person-dress" },
                    { name: "Jacket", ar: "سترة/جاكيت", price: 30, icon: "fa-vest" }, { name: "Trousers", ar: "بنطلون", price: 18, icon: "fa-vest" }, { name: "Night Gown", ar: "قميص نوم", price: 30, icon: "fa-bed" },
                    { name: "Dressing Gown", ar: "عباية", price: 30, icon: "fa-person-dress" }, { name: "Panties", ar: "سروال داخلي", price: 12, icon: "fa-vest" }, { name: "Scarf", ar: "حجاب/شيلة", price: 15, icon: "fa-head-side-mask" }
                ],
                "CHILDREN": [
                    { name: "Child - Shorts", ar: "شورت", price: 7, icon: "fa-child" }, { name: "Child - Trouser", ar: "بنطلون", price: 12, icon: "fa-child" }, { name: "Child - Shirt", ar: "قميص", price: 7, icon: "fa-child" },
                    { name: "Child - T-Shirt", ar: "قميص خفيف", price: 12, icon: "fa-child" }, { name: "Child - Dishdasha", ar: "دشداشة", price: 7, icon: "fa-child" }, { name: "Child - Dress", ar: "فستان", price: 22, icon: "fa-child" }
                ]
            },
            dry: {
                "GENTLEMEN": [
                    { name: "Suit (2 pcs.)", ar: "بدلة قطعتين", price: 54, icon: "fa-user-tie" }, { name: "Trousers", ar: "بنطلون", price: 36, icon: "fa-vest" }, { name: "Jacket", ar: "جاكيت", price: 30, icon: "fa-vest" },
                    { name: "Shirt (Silk)", ar: "قميص حرير", price: 24, icon: "fa-shirt" }, { name: "Dishdash", ar: "دشداشة", price: 36, icon: "fa-user-tie" }, { name: "T-Shirt", ar: "قميص خفيف", price: 27, icon: "fa-shirt" }
                ],
                "LADIES": [
                    { name: "Dress", ar: "فستان", price: 48, icon: "fa-person-dress" }, { name: "Blouse", ar: "بلوزة", price: 36, icon: "fa-shirt" }, { name: "Skirt", ar: "تنورة", price: 27, icon: "fa-person-dress" },
                    { name: "Abbaya", ar: "عباية", price: 36, icon: "fa-person-dress" }, { name: "Scarf", ar: "حجاب/شيلة", price: 18, icon: "fa-head-side-mask" }
                ]
            },
            pressing: {
                "GENTLEMEN": [
                    { name: "Suit (2 pcs.)", ar: "بدلة قطعتين", price: 30, icon: "fa-user-tie" }, { name: "Trousers", ar: "بنطلون", price: 12, icon: "fa-vest" }, { name: "Shirt", ar: "قميص", price: 12, icon: "fa-shirt" },
                    { name: "Dishdash", ar: "دشداشة", price: 18, icon: "fa-user-tie" }, { name: "T-Shirt", ar: "قميص خفيف", price: 10, icon: "fa-shirt" }
                ],
                "LADIES": [
                    { name: "Blouse", ar: "بلوزة", price: 12, icon: "fa-shirt" }, { name: "Dress", ar: "فستان", price: 30, icon: "fa-person-dress" }, { name: "Skirt", ar: "تنورة", price: 15, icon: "fa-person-dress" },
                    { name: "Abbaya", ar: "عباية", price: 21, icon: "fa-person-dress" }
                ]
            }
        };

        let catalogService = 'laundry';
        let currentCountType = 'hotel';
        let catalogCart = {};

        function openLaundryModal() {
            document.getElementById('laundryModal').classList.remove('hidden');
            renderCatalogItems();
        }

        function closeLaundryModal() {
            document.getElementById('laundryModal').classList.add('hidden');
        }

        function selectCountType(type) {
            currentCountType = type;
            document.getElementById('btnCountHotel').className = type === 'hotel' ? 'py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold leading-tight' : 'py-2.5 px-1 rounded-xl text-stone-400 leading-tight';
            document.getElementById('btnCountQuotaExtra').className = type === 'quota_extra' ? 'py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold leading-tight' : 'py-2.5 px-1 rounded-xl text-stone-400 leading-tight';
            document.getElementById('btnCountGuest').className = type === 'guest' ? 'py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold leading-tight' : 'py-2.5 px-1 rounded-xl text-stone-400 leading-tight';
            
            renderCatalogItems();
        }

        function switchCatalogService(service) {
            catalogService = service;
            ['laundry', 'dry', 'pressing'].forEach(s => {
                const btn = document.getElementById(`catTab${s.charAt(0).toUpperCase() + s.slice(1)}`);
                if (s === service) {
                    btn.className = "flex-1 py-2.5 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow font-bold transition";
                } else {
                    btn.className = "flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-stone-400 border border-[var(--border-gold)] transition";
                }
            });
            renderCatalogItems();
        }

        function renderCatalogItems() {
            const container = document.getElementById('catalogItemsContainer');
            container.innerHTML = '';
            const serviceData = database[catalogService];
            let totalPieces = 0;
            let subtotal = 0;

            for (const [catName, items] of Object.entries(serviceData)) {
                const catHeader = document.createElement('div');
                catHeader.className = 'bg-[var(--bg-dark)] text-[var(--text-gold)] px-3 py-1.5 rounded-xl font-bold text-[11px] uppercase tracking-wider mb-2 mt-2 border border-[var(--border-gold)]';
                catHeader.innerText = catName;
                container.appendChild(catHeader);

                items.forEach(item => {
                    const key = `${catalogService}_${item.name}`;
                    const entry = catalogCart[key] || { qty: 0, freeQty: 0, name: item.name, price: item.price };
                    const qty = entry.qty;
                    const freeQty = entry.freeQty || 0;
                    totalPieces += qty;

                    if (currentCountType === 'guest') {
                        subtotal += item.price * qty;
                    } else if (currentCountType === 'quota_extra') {
                        let chargeable = qty - freeQty;
                        if (chargeable < 0) chargeable = 0;
                        subtotal += item.price * chargeable;
                    }

                    const priceDisplay = currentCountType === 'hotel' ? '0.00 AED' : `${item.price.toFixed(2)} AED`;

                    let freeControlsHtml = '';
                    if (currentCountType === 'quota_extra' && qty > 0) {
                        freeControlsHtml = `
                            <div class="flex items-center gap-1 mt-1 bg-[var(--bg-dark)] px-2 py-0.5 rounded-lg border border-[var(--border-gold)] text-[9px]">
                                <span class="text-stone-400 font-semibold">Free:</span>
                                <button onclick="updateCatalogFreeQty('${key}', -1)" class="w-5 h-5 bg-[var(--bg-card-hover)] text-stone-200 rounded font-bold">-</button>
                                <span class="text-emerald-400 font-bold px-1">${freeQty}</span>
                                <button onclick="updateCatalogFreeQty('${key}', 1)" class="w-5 h-5 bg-[var(--text-gold)] text-stone-950 rounded font-bold">+</button>
                            </div>
                        `;
                    }

                    const row = document.createElement('div');
                    row.className = 'flex justify-between items-center py-2.5 border-b border-[var(--border-gold)] text-xs';
                    row.innerHTML = `

        function updateCatalogQty(key, name, price, delta) {
            if (!catalogCart[key]) catalogCart[key] = { name: name, price: price, qty: 0, freeQty: 0 };
            catalogCart[key].qty += delta;
            if (catalogCart[key].freeQty > catalogCart[key].qty) catalogCart[key].freeQty = catalogCart[key].qty;
            if (catalogCart[key].qty <= 0) delete catalogCart[key];
            renderCatalogItems();
        }

        function updateCatalogFreeQty(key, delta) {
            if (!catalogCart[key]) return;
            catalogCart[key].freeQty += delta;
            if (catalogCart[key].freeQty < 0) catalogCart[key].freeQty = 0;
            if (catalogCart[key].freeQty > catalogCart[key].qty) catalogCart[key].freeQty = catalogCart[key].qty;
            renderCatalogItems();
        }

        function confirmLaundrySelection() {
            let totalPcs = 0;
            let subtotalCalc = 0;

            Object.values(catalogCart).forEach(item => {
                if (item.qty > 0) {
                    totalPcs += item.qty;
                    let countMode = currentCountType || 'hotel';
                    if (countMode === 'guest') {
                        subtotalCalc += item.price * item.qty;
                    } else if (countMode === 'quota_extra') {
                        let free = item.freeQty || 0;
                        let extra = item.qty - free;
                        if (extra < 0) extra = 0;
                        subtotalCalc += item.price * extra;
                    }
                }
            });

            document.getElementById('selectedBadgeCount').innerText = `${totalPcs} pcs`;
            
            const floatingBar = document.getElementById('floatingCartBar');
            if (totalPcs > 0) {
                document.getElementById('floatingCartPieces').innerText = `${totalPcs} pieces selected`;
                document.getElementById('floatingCartPrice').innerText = `${subtotalCalc.toFixed(2)} AED`;
                floatingBar.classList.remove('hidden');
            } else {
                floatingBar.classList.add('hidden');
            }

            window.finalLaundryCart = catalogCart;
            window.finalLaundryCountType = currentCountType;

            closeLaundryModal();
        }

        async function chargerInfosChambre(roomNum) {
            const box = document.getElementById('roomInfoBox');
            if (!roomNum || roomNum.length < 3) {
                box.classList.add('hidden');
                return;
            }

            localStorage.setItem('remal_guest_room', roomNum);

            const { data, error } = await supabaseClient
                .from('pms_guests')
                .select('*')
                .eq('room', roomNum)
                .single();

            if (error || !data) {
                document.getElementById('displayGuestName').innerText = "Guest (" + roomNum + ")";
                document.getElementById('displayQuota').innerText = "Standard";
                cachedGuestData = { guest_name: "Guest", quota_text: "Standard" };
                box.classList.remove('hidden');
                return;
            }

            cachedGuestData = data;
            document.getElementById('displayGuestName').innerText = data.guest_name;
            document.getElementById('displayQuota').innerText = data.quota_text;
            box.classList.remove('hidden');
        }
