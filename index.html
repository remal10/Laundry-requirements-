<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remal Hotel & Villas - Guest Laundry Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0908;
            --bg-card: rgba(22, 20, 18, 0.75);
            --bg-card-hover: rgba(33, 30, 26, 0.85);
            --bg-input: rgba(15, 14, 12, 0.6);
            --text-gold: #DCA773;
            --gold-gradient: linear-gradient(135deg, #EAD0B3 0%, #DCA773 50%, #B88351 100%);
            --border-gold: rgba(220, 167, 115, 0.22);
            --border-gold-strong: rgba(220, 167, 115, 0.45);
            --text-main: #f8f6f0;
            --text-muted: #9e978e;
            --header-overlay-gradient: linear-gradient(to top, rgba(22, 20, 18, 0.95) 0%, rgba(22, 20, 18, 0.3) 60%, transparent 100%);
            --header-img-opacity: 0.55;
            --card-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        }

        .light-mode {
            --bg-dark: #f6f4f0;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(248, 246, 242, 0.95);
            --bg-input: rgba(255, 255, 255, 0.9);
            --text-gold: #b47a3e;
            --gold-gradient: linear-gradient(135deg, #cfa26d 0%, #b47a3e 50%, #8c5822 100%);
            --border-gold: rgba(180, 122, 62, 0.25);
            --border-gold-strong: rgba(180, 122, 62, 0.5);
            --text-main: #1c1917;
            --text-muted: #6b635b;
            --header-overlay-gradient: linear-gradient(to top, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.2) 60%, transparent 100%);
            --header-img-opacity: 0.75;
            --card-shadow: 0 25px 50px -12px rgba(180, 122, 62, 0.08);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .font-serif-luxury {
            font-family: 'Cinzel', serif;
        }

        .remal-card { 
            background: var(--bg-card); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-gold); 
            box-shadow: var(--card-shadow); 
        }

        .remal-input { 
            background: var(--bg-input); 
            border: 1px solid var(--border-gold); 
            color: var(--text-main); 
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .remal-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .remal-input:focus { 
            border-color: var(--text-gold); 
            box-shadow: 0 0 15px rgba(220, 167, 115, 0.15);
            outline: none; 
        }

        .text-gold-gradient {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-muted-custom {
            color: var(--text-muted);
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Luxe Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-input);
            border: 1px solid var(--border-gold);
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 30px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--border-gold-strong);
            border-color: var(--text-gold);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(16px);
            background-color: var(--text-gold);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex items-center justify-center pb-24">

    <div class="w-full max-w-md remal-card p-6 sm:p-8 rounded-[2rem] space-y-6 relative">
        
        <!-- BARRE SUPÉRIEURE : MODE NUIT/JOUR & SELECTEUR DE LANGUE DE LUXE -->
        <div class="flex justify-between items-center">
            <button onclick="toggleTheme()" class="bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] w-10 h-10 rounded-2xl text-xs flex items-center justify-center shadow-lg transition hover:scale-105 active:scale-95" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon text-sm" id="themeIcon"></i>
            </button>

            <!-- SELECTEUR DE LANGUE DRAPEAUX -->
            <div class="relative inline-block text-left">
                <button onclick="toggleLangDropdown()" id="langDropdownBtn" class="bg-[var(--bg-card-hover)] text-[var(--text-gold)] border border-[var(--border-gold)] text-xs font-semibold rounded-2xl px-3.5 py-2 flex items-center gap-2 shadow-md transition hover:scale-105">
                    <span id="currentLangFlag">🇬🇧</span> <span id="currentLangText">English</span> <i class="fas fa-chevron-down text-[9px] opacity-70"></i>
                </button>
                <div id="langMenu" class="hidden absolute right-0 mt-2 w-40 bg-[var(--bg-card)] backdrop-blur-xl border border-[var(--border-gold)] rounded-2xl shadow-2xl z-50 overflow-hidden text-xs font-medium animate-fade-in">
                    <button onclick="changerLangueCustom('en')" class="w-full text-left px-4 py-3 hover:bg-[var(--bg-card-hover)] flex items-center gap-3 border-b border-[var(--border-gold)] transition">
                        <span>🇬🇧</span> English
                    </button>
                    <button onclick="changerLangueCustom('fr')" class="w-full text-left px-4 py-3 hover:bg-[var(--bg-card-hover)] flex items-center gap-3 border-b border-[var(--border-gold)] transition">
                        <span>🇫🇷</span> Français
                    </button>
                    <button onclick="changerLangueCustom('ar')" class="w-full text-left px-4 py-3 hover:bg-[var(--bg-card-hover)] flex items-center gap-3 border-b border-[var(--border-gold)] transition">
                        <span>🇦🇪</span> العربية
                    </button>
                    <button onclick="changerLangueCustom('hi')" class="w-full text-left px-4 py-3 hover:bg-[var(--bg-card-hover)] flex items-center gap-3 transition">
                        <span>🇮🇳</span> हिन्दी
                    </button>
                </div>
            </div>
        </div>

        <!-- EN-TÊTE AVEC BANNIÈRE LUXE HÔTEL -->
        <div class="relative text-center border border-[var(--border-gold)] pb-6 pt-7 rounded-2xl overflow-hidden shadow-inner">
            <div class="absolute inset-0 bg-cover bg-center pointer-events-none transition-opacity duration-500 scale-105" style="background-image: url('remal-hotel.jpg'); opacity: var(--header-img-opacity);"></div>
            <div class="absolute inset-0 pointer-events-none" style="background: var(--header-overlay-gradient);"></div>

            <div class="relative z-10 space-y-1.5">
                <h1 class="text-2xl font-serif-luxury font-bold text-gold-gradient tracking-[0.25em] drop-shadow-lg">REMAL</h1>
                <p class="text-[9px] text-[var(--text-main)] tracking-[0.2em] font-semibold uppercase opacity-90">Hotel & Villas • Al Ruwais City</p>
                <div class="pt-2">
                    <span class="inline-block text-[9px] bg-[var(--bg-card)] text-[var(--text-gold)] border border-[var(--border-gold)] font-bold px-3.5 py-1 rounded-full uppercase tracking-[0.15em] shadow-md backdrop-blur-md" data-i18n="badgeTitle">
                        Laundry & Valet Service
                    </span>
                </div>
            </div>
        </div>

        <!-- INDICATEUR D'ÉTAPES VISUEL -->
        <div class="grid grid-cols-3 gap-2 text-center text-[9px] font-semibold tracking-widest text-muted-custom uppercase pb-1">
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-2 rounded-xl text-[var(--text-gold)] font-bold shadow-sm">1. Room</div>
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-2 rounded-xl text-[var(--text-gold)] font-bold shadow-sm">2. Selection</div>
            <div class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] py-2 rounded-xl opacity-60">3. Send</div>
        </div>

        <!-- FORMULAIRE DE REQUÊTE -->
        <div class="space-y-4 text-xs">
            <div class="flex justify-between items-center">
                <label class="block font-semibold text-muted-custom uppercase tracking-wider text-[10px]" data-i18n="roomLabel">Room Number *</label>
                <button onclick="changerDeChambre()" id="btnChangeRoom" class="hidden text-[10px] text-[var(--text-gold)] hover:underline font-bold tracking-wider uppercase" data-i18n="changeRoom">Change</button>
            </div>
            
            <input type="number" id="guestRoomInput" oninput="chargerInfosChambre(this.value)" placeholder="e.g., 103" class="w-full remal-input rounded-2xl p-4 font-bold text-lg text-[var(--text-gold)] tracking-wide">

            <!-- TOGGLE SWITCH CUSTOM : EXTRA CHARGED -->
            <div class="flex items-center justify-between p-3.5 bg-[var(--bg-card-hover)] border border-[var(--border-gold)] rounded-2xl cursor-pointer transition hover:border-[var(--text-gold)]">
                <label for="extraChargedCheck" class="font-medium text-[var(--text-main)] cursor-pointer select-none text-[11px] pr-2" data-i18n="extraChargedLabel">I accept to pay for Extra Charged items</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="extraChargedCheck">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- FICHE CLIENT DYNAMIQUE SUPABASE -->
            <div id="roomInfoBox" class="hidden p-4 bg-[var(--bg-card-hover)] border border-[var(--border-gold)] rounded-2xl space-y-2 transition-all animate-fade-in shadow-inner">
                <div class="flex justify-between font-medium">
                    <span class="text-muted-custom text-[11px]" data-i18n="guestName">Guest Name:</span> 
                    <span id="displayGuestName" class="text-[var(--text-gold)] font-semibold">---</span>
                </div>
                <div class="flex justify-between font-medium border-t border-[var(--border-gold)] pt-2">
                    <span class="text-muted-custom text-[11px]" data-i18n="pmsQuota">PMS Quota:</span> 
                    <span id="displayQuota" class="text-emerald-500 font-semibold">---</span>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-muted-custom mb-1.5 uppercase tracking-wider text-[10px]" data-i18n="serviceType">Service Type</label>
                <select id="guestServiceSelect" class="w-full remal-input rounded-2xl p-3.5 font-medium cursor-pointer text-xs">
                    <option value="Laundry Collection" data-i18n="opt1">Laundry Collection</option>
                    <option value="Dry Cleaning" data-i18n="opt2">Dry Cleaning</option>
                    <option value="Pressing Only" data-i18n="opt3">Pressing Only</option>
                    <option value="Extra Hangers" data-i18n="opt4">Extra Hangers</option>
                    <option value="On Hanger" data-i18n="opt5">On Hanger</option>
                    <option value="Remove the Stains" data-i18n="opt6">Remove the Stains</option>
                    <option value="Urgent" data-i18n="opt7">Urgent</option>
                </select>
            </div>

            <!-- BOUTON DU CATALOGUE LAUNDRY -->
            <div>
                <button onclick="openLaundryModal()" class="w-full bg-[var(--bg-card-hover)] hover:border-[var(--text-gold)] text-[var(--text-gold)] border border-[var(--border-gold)] font-semibold py-4 px-4 rounded-2xl transition flex items-center justify-between shadow-md hover:scale-[1.01] active:scale-[0.99]">
                    <span class="flex items-center gap-3"><i class="fas fa-shirt text-sm opacity-80"></i> <span data-i18n="openCatalogBtn">Select Laundry Items</span></span>
                    <span id="selectedBadgeCount" class="bg-[var(--text-gold)] text-stone-950 px-3 py-1 rounded-full text-[10px] font-bold shadow-sm">0 pcs</span>
                </button>
            </div>

            <!-- NOTES ET DÉTAILS -->
            <div>
                <label class="block font-semibold text-muted-custom mb-1.5 uppercase tracking-wider text-[10px]" data-i18n="notesLabel">Special Recommendations / Notes</label>
                <textarea id="guestDetailsArea" data-i18n-placeholder="notesPlaceholder" placeholder="e.g., Stain on collar, handle with care..." class="w-full h-20 remal-input rounded-2xl p-3.5 outline-none resize-none font-medium text-xs"></textarea>
            </div>

            <button onclick="openPolicyConfirmationModal()" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-stone-950 font-bold py-4 rounded-2xl text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2.5 uppercase tracking-widest mt-3 hover:scale-[1.01] active:scale-[0.99]">
                <i class="fab fa-whatsapp text-lg"></i> <span data-i18n="whatsappBtn">Send Request on WhatsApp</span>
            </button>
        </div>

        <div class="text-center text-[9px] text-muted-custom pt-3 border-t border-[var(--border-gold)] tracking-widest uppercase opacity-80" data-i18n="footerText">
            Remal Hotel & Villas Digital Systems
        </div>
    </div>

    <!-- BARRE FLOTTANTE PANIER -->
    <div id="floatingCartBar" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-[var(--bg-card)] backdrop-blur-xl border border-[var(--border-gold-strong)] p-3.5 rounded-2xl shadow-2xl z-50 flex justify-between items-center animate-fade-in no-print">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-[var(--text-gold)] text-stone-950 font-black flex items-center justify-center text-xs shadow-md">
                <i class="fas fa-basket-shopping"></i>
            </div>
            <div>
                <p id="floatingCartPieces" class="text-xs font-bold text-[var(--text-gold)]">0 pieces selected</p>
                <p id="floatingCartPrice" class="text-[10px] text-muted-custom font-medium">0.00 AED</p>
            </div>
        </div>
        <button onclick="openLaundryModal()" class="bg-[var(--text-gold)] hover:bg-[#c89360] text-stone-950 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider shadow-md transition" data-i18n="viewCartBtn">
            View / Edit
        </button>
    </div>

    <!-- MODALE CATALOGUE ET TARIFS -->
    <div id="laundryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[var(--bg-card)] backdrop-blur-2xl border border-[var(--border-gold)] w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
            
            <div class="flex justify-between items-center border-b border-[var(--border-gold)] pb-3">
                <h3 class="text-xs font-serif-luxury font-bold text-[var(--text-gold)] uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-list-check"></i> <span data-i18n="catalogTitle">Laundry Price List & Selection</span>
                </h3>
                <button onclick="closeLaundryModal()" class="text-muted-custom hover:text-[var(--text-main)] text-xl font-bold p-1">✕</button>
            </div>

            <!-- RECHERCHE DANS LE CATALOGUE -->
            <div class="relative">
                <i class="fas fa-magnifying-glass absolute left-3.5 top-3 text-muted-custom text-xs"></i>
                <input type="text" id="catalogSearchInput" oninput="renderCatalogItems()" placeholder="Search item (e.g., Overall, Dress, Shirt)..." class="w-full remal-input rounded-xl pl-9 pr-3 py-2 text-xs font-medium">
            </div>

            <!-- 3 BOUTONS DE COMPTAGE -->
            <div>
                <label class="block text-[9px] font-semibold text-muted-custom mb-1.5 uppercase tracking-widest" data-i18n="accountTypeLabel">Account & Quota Type</label>
                <div class="grid grid-cols-3 gap-1.5 bg-[var(--bg-dark)] p-1.5 rounded-2xl border border-[var(--border-gold)] text-[10px] font-bold text-center">
                    <button onclick="selectCountType('hotel', true)" id="btnCountHotel" class="py-2.5 px-1 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow transition leading-tight">Hotel Count (Free)</button>
                    <button onclick="selectCountType('quota_extra', true)" id="btnCountQuotaExtra" class="py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight">Hotel & Extra</button>
                    <button onclick="selectCountType('guest', true)" id="btnCountGuest" class="py-2.5 px-1 rounded-xl text-muted-custom transition leading-tight">Guest Count (Full)</button>
                </div>
            </div>

            <!-- ONGLETS DE SERVICES -->
            <div class="flex gap-2 text-xs font-bold">
                <button onclick="switchCatalogService('laundry')" id="catTabLaundry" class="flex-1 py-2.5 rounded-xl bg-[var(--text-gold)] text-stone-950 shadow transition">Laundry</button>
                <button onclick="switchCatalogService('dry')" id="catTabDry" class="flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-muted-custom border border-[var(--border-gold)] transition">Dry Cleaning</button>
                <button onclick="switchCatalogService('pressing')" id="catTabPressing" class="flex-1 py-2.5 rounded-xl bg-[var(--bg-dark)] text-muted-custom border border-[var(--border-gold)] transition">Pressing</button>
            </div>

            <!-- CONTENEUR DES ARTICLES -->
            <div id="catalogItemsContainer" class="flex-1 overflow-y-auto pr-1 space-y-3 scrollbar-none"></div>

            <div class="border-t border-[var(--border-gold)] pt-3 space-y-3">
                <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-muted-custom" data-i18n="modalSelectedTotal">Selected Items & Subtotal:</span>
                    <span id="modalCatalogTotalSummary" class="text-[var(--text-gold)] font-serif-luxury text-sm">0 pcs · 0.00 AED</span>
                </div>
                <button onclick="confirmLaundrySelection()" class="w-full bg-[var(--text-gold)] hover:bg-[#c89360] text-stone-950 font-bold py-3.5 rounded-2xl text-xs uppercase tracking-widest shadow-lg transition hover:scale-[1.01]" data-i18n="confirmSelectionBtn">
                    Confirm Selection
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE POLITIQUE DE L'HÔTEL -->
    <div id="policyModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-[120] flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[var(--bg-card)] backdrop-blur-2xl border border-[var(--border-gold)] w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col text-xs" id="policyModalContent">
            
            <div class="flex justify-between items-center border-b border-[var(--border-gold)] pb-3">
                <h3 class="text-xs font-serif-luxury font-bold text-[var(--text-gold)] uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-file-contract"></i> <span id="policyModalHeader">Order Confirmation & Policy</span>
                </h3>
                <button onclick="closePolicyConfirmationModal()" class="text-muted-custom hover:text-[var(--text-main)] text-xl font-bold p-1">✕</button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-4 pr-1 scrollbar-none">
                <div id="modalVatNotice" class="bg-[var(--bg-card-hover)] border border-[var(--border-gold)] p-3 rounded-2xl text-center font-semibold text-[var(--text-gold)] text-[11px]"></div>

                <div class="space-y-2 bg-[var(--bg-dark)] p-3.5 rounded-2xl border border-[var(--border-gold)]">
                    <h4 id="modalDeliveryTitle" class="font-bold uppercase text-[var(--text-gold)] text-[10px] border-b border-[var(--border-gold)] pb-1.5 tracking-wider flex items-center gap-2">
                        <i class="fas fa-clock"></i> <span></span>
                    </h4>
                    <ul class="space-y-1.5 text-[var(--text-main)] text-[11px] leading-relaxed">
                        <li id="modalBefore9"></li>
                        <li id="modalAfter9"></li>
                        <li id="modalExpress" class="font-bold text-amber-500 pt-1"></li>
                    </ul>
                </div>

                <div class="space-y-2 bg-[var(--bg-dark)] p-3.5 rounded-2xl border border-[var(--border-gold)]">
                    <h4 id="modalTermsTitle" class="font-bold uppercase text-[var(--text-gold)] text-[10px] border-b border-[var(--border-gold)] pb-1.5 tracking-wider flex items-center gap-2">
                        <i class="fas fa-circle-exclamation"></i> <span></span>
                    </h4>
                    <p id="modalTermsBody" class="text-[11px] text-muted-custom leading-relaxed"></p>
                    
                    <div id="modalLiability" class="bg-red-500/10 border-l-2 border-red-500 p-3 rounded-r-xl text-red-500 font-semibold text-[11px] mt-2 leading-relaxed"></div>
                </div>
            </div>

            <div class="border-t border-[var(--border-gold)] pt-3 space-y-3">
                <div class="flex items-start gap-2.5 bg-[var(--bg-dark)] p-3 rounded-2xl border border-[var(--border-gold)]">
                    <input type="checkbox" id="acceptPolicyCheck" class="w-4 h-4 mt-0.5 accent-[#DCA773] cursor-pointer">
                    <label for="acceptPolicyCheck" class="text-[11px] font-medium text-[var(--text-main)] cursor-pointer select-none" id="modalAcceptCheckText">
                        I have read and agree to the hotel laundry policies and delivery terms.
                    </label>
                </div>

                <button id="finalSendBtnContainer" onclick="confirmAndSendWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-stone-950 font-bold py-3.5 rounded-2xl text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2.5 uppercase tracking-widest hover:scale-[1.01]">
                    <i id="btnSendIcon" class="fab fa-whatsapp text-lg"></i> 
                    <span id="modalFinalSendBtn">Confirm & Send on WhatsApp</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        const flags = { en: "🇬🇧", fr: "🇫🇷", ar: "🇦🇪", hi: "🇮🇳" };
        const langNames = { en: "English", fr: "Français", ar: "العربية", hi: "हिन्दी" };

        function toggleLangDropdown() {
            document.getElementById('langMenu').classList.toggle('hidden');
        }

        function changerLangueCustom(lang) {
            document.getElementById('langMenu').classList.add('hidden');
            document.getElementById('currentLangFlag').innerText = flags[lang];
            document.getElementById('currentLangText').innerText = langNames[lang];
            changerLangue(lang);
        }

        function triggerErrorNotification() {
            if ("vibrate" in navigator) {
                navigator.vibrate(100);
            }
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function parsePMSQuotaNumber(quotaStr) {
            if (!quotaStr) return 0;
            let cleaned = quotaStr.toLowerCase();
            if (cleaned.includes('chargeable') || cleaned.includes('no free') || cleaned.includes('standard')) return 0;
            
            const match = cleaned.match(/\d+/);
            if (match) {
                return parseInt(match[0], 10);
            }
            return 0;
        }

        function selectCountType(type, isManualClick = false) {
            const quotaText = cachedGuestData ? cachedGuestData.quota_text : 'Standard';
            const allowedFreePcs = parsePMSQuotaNumber(quotaText);
            const isChargeable = quotaText.toLowerCase().includes('chargeable') || allowedFreePcs === 0;

            let currentTotalPcs = 0;
            Object.values(catalogCart).forEach(i => currentTotalPcs += i.qty);

            let enforcedType = type;

            if (isChargeable) {
                enforcedType = 'guest';
                if (isManualClick && type !== 'guest') {
                    triggerErrorNotification();
                    alert(currentLang === 'ar' 
                        ? '⚠️ هذه الغرفة غير مشمولة بالحصة المجانية. يتم تطبيق رسوم الكاملة تلقائياً.' 
                        : '⚠️ This room has no free quota package. Full Guest Count applies.');
                }
            } else {
                if (currentTotalPcs > allowedFreePcs) {
                    enforcedType = 'quota_extra';
                    if (isManualClick && type !== 'quota_extra') {
                        triggerErrorNotification();
                        alert(currentLang === 'ar' 
                            ? `⚠️ لقد تجاوزت الحصة المجانية (${allowedFreePcs} قطع). تم اختيار حساب القطع الإضافية تلقائياً.` 
                            : `⚠️ You have exceeded your free quota of ${allowedFreePcs} pcs. Hotel & Extra is enforced.`);
                    }
                } else {
                    enforcedType = 'hotel';
                    if (isManualClick && type !== 'hotel') {
                        triggerErrorNotification();
                        alert(currentLang === 'ar' 
                            ? `⚠️ عدد القطع ضمن الحصة المجانية (${allowedFreePcs} قطع). تم الحفاظ على الحساب المجاني.` 
                            : `⚠️ Total items are within your free quota (${allowedFreePcs} pcs). Free Hotel Count applies.`);
                    }
                }
            }

            currentCountType = enforcedType;

            renderCatalogItems();

        function renderCatalogItems() {
            const container = document.getElementById('catalogItemsContainer');
            const searchFilter = (document.getElementById('catalogSearchInput')?.value || '').toLowerCase().trim();
            container.innerHTML = '';
            const serviceData = database[catalogService];
            let totalPieces = 0;
            let subtotal = 0;

            for (const [catName, items] of Object.entries(serviceData)) {
                const filteredItems = items.filter(item => 
                    item.name.toLowerCase().includes(searchFilter) || 
                    (item.ar && item.ar.includes(searchFilter))
                );

                if (filteredItems.length === 0) continue;

                const catHeader = document.createElement('div');
                catHeader.className = 'bg-[var(--bg-dark)] text-[var(--text-gold)] px-3 py-1.5 rounded-xl font-bold text-[10px] uppercase tracking-widest mb-2 mt-2 border border-[var(--border-gold)]';
                catHeader.innerText = catName;
                container.appendChild(catHeader);

                filteredItems.forEach(item => {
                    const key = `${catalogService}_${catName}_${item.name}`;
                    const entry = catalogCart[key] || { qty: 0, freeQty: 0, name: item.name, category: catName, price: item.price };
                    const qty = entry.qty;
                    const freeQty = entry.freeQty || 0;
                    totalPieces += qty;

                    if (currentCountType === 'guest') {
                        subtotal += item.price * qty;
                    } else if (currentCountType === 'quota_extra') {
                        let chargeable = qty - freeQty;
                        if (chargeable < 0) chargeable = 0;
                        subtotal += item.price * chargeable;
                    }

                    const priceDisplay = currentCountType === 'hotel' ? '0.00 AED' : `${item.price.toFixed(2)} AED`;

                    let freeControlsHtml = '';
                    if (currentCountType === 'quota_extra' && qty > 0) {
                        freeControlsHtml = `

        function updateCatalogQty(key, name, price, delta, catName = '') {
            if (!catalogCart[key]) {
                catalogCart[key] = { name: name, category: catName, price: price, qty: 0, freeQty: 0 };
            }
            catalogCart[key].qty += delta;

            if (catalogCart[key].qty <= 0) {
                delete catalogCart[key];
            }

            const quotaText = cachedGuestData ? cachedGuestData.quota_text : 'Standard';
            const allowedFreePcs = parsePMSQuotaNumber(quotaText);

            selectCountType(currentCountType, false);

            if (currentCountType === 'quota_extra') {
                document.getElementById('extraChargedCheck').checked = true;
                let remainingFree = allowedFreePcs;
                Object.keys(catalogCart).forEach(itemKey => {
                    let item = catalogCart[itemKey];
                    if (item.qty <= remainingFree) {
                        item.freeQty = item.qty;
                        remainingFree -= item.qty;
                    } else {
                        item.freeQty = remainingFree;
                        remainingFree = 0;
                    }
                });
            } else if (currentCountType === 'hotel') {
                Object.values(catalogCart).forEach(i => i.freeQty = i.qty);
            }

            renderCatalogItems();
        }

        function updateCatalogFreeQty(key, delta) {
            if (!catalogCart[key]) return;
            catalogCart[key].freeQty += delta;
            if (catalogCart[key].freeQty < 0) catalogCart[key].freeQty = 0;
            if (catalogCart[key].freeQty > catalogCart[key].qty) catalogCart[key].freeQty = catalogCart[key].qty;
            renderCatalogItems();
        }

        function confirmLaundrySelection() {
            let totalPcs = 0;
            let subtotalCalc = 0;

            Object.values(catalogCart).forEach(item => {
                if (item.qty > 0) {
                    totalPcs += item.qty;
                    let countMode = currentCountType || 'hotel';
                    if (countMode === 'guest') {
                        subtotalCalc += item.price * item.qty;
                    } else if (countMode === 'quota_extra') {
                        let free = item.freeQty || 0;
                        let extra = item.qty - free;
                        if (extra < 0) extra = 0;
                        subtotalCalc += item.price * extra;
                    }
                }
            });

            document.getElementById('selectedBadgeCount').innerText = `${totalPcs} pcs`;
            
            const floatingBar = document.getElementById('floatingCartBar');
            if (totalPcs > 0) {
                document.getElementById('floatingCartPieces').innerText = `${totalPcs} pieces selected`;
                document.getElementById('floatingCartPrice').innerText = `${subtotalCalc.toFixed(2)} AED`;
                floatingBar.classList.remove('hidden');
            } else {
                floatingBar.classList.add('hidden');
            }

            window.finalLaundryCart = catalogCart;
            window.finalLaundryCountType = currentCountType;

            closeLaundryModal();
        }

        function changerLangue(lang) {
            currentLang = lang;
            localStorage.setItem('remal_lang', lang);
            const t = traductions[lang];
            const htmlRoot = document.getElementById('htmlRoot');
            if (lang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

            // 1. Détection via l'URL du QR Code (ex: ?room=109)

            const roomFromUrl = urlParams.get('room');

            if (roomFromUrl) {
                const roomField = document.getElementById('guestRoomInput');
                roomField.value = roomFromUrl;
                roomField.setAttribute('readonly', true);
                document.getElementById('btnChangeRoom').classList.add('hidden'); // Désactive la modification si scanné via QR Code
                chargerInfosChambre(roomFromUrl);
            } else {
                // 2. Sinon, récupère la chambre sauvegardée localement
                const savedRoom = localStorage.getItem('remal_guest_room');
                if (savedRoom) {
                    const roomField = document.getElementById('guestRoomInput');
                    roomField.value = savedRoom;
                    roomField.setAttribute('readonly', true);
                    document.getElementById('btnChangeRoom').classList.remove('hidden');
                    chargerInfosChambre(savedRoom);

        async function chargerInfosChambre(roomNum) {
            const box = document.getElementById('roomInfoBox');
            if (!roomNum || roomNum.length < 3) {
                box.classList.add('hidden');
                return;
            }

            localStorage.setItem('remal_guest_room', roomNum);

            const { data, error } = await supabaseClient
                .from('pms_guests')
                .select('*')
                .eq('room', roomNum)
                .single();

            if (error || !data) {
                document.getElementById('displayGuestName').innerText = "Guest (" + roomNum + ")";
                document.getElementById('displayQuota').innerText = "Standard";
                cachedGuestData = { guest_name: "Guest", quota_text: "Standard" };
                box.classList.remove('hidden');
                return;
            }

            cachedGuestData = data;
            document.getElementById('displayGuestName').innerText = data.guest_name;
            document.getElementById('displayQuota').innerText = data.quota_text;
            box.classList.remove('hidden');

            const isChargeable = data.quota_text.toLowerCase().includes('chargeable');
            if (isChargeable) {
                selectCountType('guest', false);
                document.getElementById('extraChargedCheck').checked = true;
            } else {

        /* MESSAGE WHATSAPP : STRICTEMENT EN ANGLAIS À 100 % POUR LA RÉCEPTIONS / BUANDERIE */
        function envoyerRequeteWhatsApp() {
            const room = document.getElementById('guestRoomInput').value.trim();
            const service = document.getElementById('guestServiceSelect').value;
            const specialNotes = document.getElementById('guestDetailsArea').value.trim();
            const isExtraCharged = document.getElementById('extraChargedCheck').checked;

            let itemsListText = "";
            let totalPiecesCalc = 0;
            let subtotalCalc = 0;

            if (window.finalLaundryCart && Object.keys(window.finalLaundryCart).length > 0) {
                let formattedItems = [];
                Object.values(window.finalLaundryCart).forEach(item => {
                    if (item.qty > 0) {
                        totalPiecesCalc += item.qty;
                        let line = `• ${item.qty}x ${item.name}`;
                        let countMode = window.finalLaundryCountType || 'hotel';
                        
                        if (countMode === 'guest') {
                            let linePrice = item.price * item.qty;
                            subtotalCalc += linePrice;
                            line += ` (${linePrice.toFixed(2)} AED)`;
                        } else if (countMode === 'quota_extra') {
                            let free = item.freeQty || 0;
                            let extra = item.qty - free;
                            if (extra < 0) extra = 0;
                            let linePrice = item.price * extra;
                            subtotalCalc += linePrice;
                            line += ` [${free} Free, ${extra} Extra - ${linePrice.toFixed(2)} AED]`;
                        } else {
                            line += ` (Hotel Free Count)`;
                        }
                        formattedItems.push(line);
                    }
                });
                if (formattedItems.length > 0) {
                    itemsListText = formattedItems.join('\n');
                }
            }

            const guestName = cachedGuestData ? cachedGuestData.guest_name : 'Guest';
            const quotaText = cachedGuestData ? cachedGuestData.quota_text : 'Standard';
            const numeroWhatsAppLaundry = "971561314938";

            const vatCalc = subtotalCalc * 0.05;
            const grandTotalCalc = subtotalCalc + vatCalc;

            const extraChargedText = isExtraCharged ? "✅ YES (Accepts Extra Charges)" : "❌ NO";
            const finalItemsText = itemsListText || "No items selected from catalog";
            const finalNotesText = specialNotes || "None";

            const message = `*🛎️ NEW LAUNDRY REQUEST - GUEST*\n\n` +
                            `🏨 *Room:* ${room}\n` +
                            `👤 *Guest Name:* ${guestName}\n` +
                            `📋 *PMS Quota:* ${quotaText}\n` +
                            `💳 *Extra Charged:* ${extraChargedText}\n` +
                            `🛠️ *Service:* ${service}\n\n` +
                            `🧺 *Selected Items (${totalPiecesCalc} pcs):*\n${finalItemsText}\n\n` +
                            `💰 *Subtotal:* ${subtotalCalc.toFixed(2)} AED\n` +
                            `🧾 *VAT (5%):* ${vatCalc.toFixed(2)} AED\n` +
                            `💎 *Grand Total:* ${grandTotalCalc.toFixed(2)} AED\n\n` +
                            `📝 *Special Recommendations / Notes:*\n${finalNotesText}\n\n` +
                            `_Sent from Guest Portal (Terms Accepted)._`;

            const urlWhatsApp = `https://wa.me/${numeroWhatsAppLaundry}?text=${encodeURIComponent(message)}`;
            window.open(urlWhatsApp, '_blank');
        }
